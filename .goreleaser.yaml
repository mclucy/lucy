# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: lucy

before:
  hooks:
    - sh _patches/glamour/materialize.sh
    - go run ./tools/gendocs

builds:
  - id: lucy
    main: .
    binary: lucy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
      - -modfile=.build/glamour/build.mod
    tags:
      - release
      - docsarchive
      - nethttpomithttp2
    ldflags:
      - -s -w
      - -X github.com/mclucy/lucy/cmd.version={{.Version}}
      - -X github.com/mclucy/lucy/cmd.commit={{.Commit}}
      - -X github.com/mclucy/lucy/cmd.telemetryRelease={{ if .IsSnapshot }}false{{ else }}true{{ end }}
      - -X github.com/mclucy/lucy/internal/cipher.keyA={{.Env.CIPHER_KEY_A}}
      - -X github.com/mclucy/lucy/internal/cipher.keyB={{.Env.CIPHER_KEY_B}}
      - -X github.com/mclucy/lucy/internal/cipher.ciphertextA={{.Env.CIPHER_CIPHERTEXT_A}}
      - -X github.com/mclucy/lucy/internal/cipher.ciphertextB={{.Env.CIPHER_CIPHERTEXT_B}}
      # Tagged releases bind AD to version+commit. Snapshots leave identity empty
      # so locally generated unbound material decrypts correctly.
      - >-
        -X github.com/mclucy/lucy/internal/cipher.releaseVersion={{ if .IsSnapshot }}{{ else }}{{ .Version }}{{ end }}
      - >-
        -X github.com/mclucy/lucy/internal/cipher.releaseCommit={{ if .IsSnapshot }}{{ else }}{{ .FullCommit }}{{ end }}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

homebrew_casks:
  - name: lucy
    repository:
      owner: mclucy
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/mclucy/lucy"
    description: "Minecraft server environment manager"
    # The archives are not notarized, so Homebrew's quarantine attribute makes
    # macOS refuse the installed binary. This is GoReleaser's documented
    # fallback to signing and notarizing the binaries.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/lucy"]
          end

# The image carries the CLI only; it does not supervise a server. Both platforms
# are built from the release binaries, so the image and the archives cannot
# drift apart.
dockers_v2:
  - id: lucy
    ids:
      - lucy
    images:
      - ghcr.io/mclucy/lucy
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.title": "lucy"
      "org.opencontainers.image.description": "The Minecraft server package manager"
      "org.opencontainers.image.url": "https://lucy.lc"
      "org.opencontainers.image.source": "https://github.com/mclucy/lucy"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.licenses": "Apache-2.0"

release:
  prerelease: auto
  # Closes the repository-changes details block that the changelog group title
  # opens. An unmatched closing tag renders as nothing when that block is absent.
  footer: |
    </details>

    ## Installation

    macOS and Linux:

    ```sh
    curl -fsSL https://lucy.lc/sh | sh
    ```

    Windows (PowerShell):

    ```powershell
    irm https://lucy.lc/ps1 | iex
    ```

    Or install with Homebrew or Go:

    ```sh
    brew tap mclucy/tap
    brew trust --tap mclucy/tap
    brew install --cask lucy
    go install github.com/mclucy/lucy@latest
    ```

    Or run without installing with Nix:

    ```sh
    nix run github:mclucy/lucy
    ```

    To run the CLI from a container:

    ```sh
    docker pull ghcr.io/mclucy/lucy
    ```

    Full documentation: <https://lucy.lc/docs>

# Release notes follow the commit convention. User-visible changes get their
# own heading; refactors, documentation, tests, CI, and chores stay available
# but collapse into one details block, labelled by kind. Every entry keeps its
# subject, which squash merges end with the pull request number (#123). GitHub
# renders that reference as a link, so the notes name the pull request rather
# than its author.
changelog:
  use: github
  sort: asc
  groups:
    - title: Breaking changes
      regexp: '^.*?[a-z]+(\([^)]*\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\([^)]*\))?!?:.+$'
      order: 1
    - title: Bug fixes
      regexp: '^.*?fix(\([^)]*\))?!?:.+$'
      order: 2
    - title: Performance
      regexp: '^.*?perf(\([^)]*\))?!?:.+$'
      order: 3
    # GoReleaser omits a group whose regexp matched nothing, title included.
    # One group therefore collects every repository change, so the details
    # wrapper appears whenever any of them exists. The format labels each entry
    # by its conventional type because per-kind groups cannot share a wrapper
    # that must exist independently of which kinds a release contains. This
    # group must precede the catch-all below, which consumes all remaining
    # entries.
    - title: "\n<details><summary>Repository changes</summary>\n\n"
      regexp: '^(refactor|docs|test|ci|chore|style|wip)(\([^)]*\))?!?:'
      order: 5
    - title: Other changes
      order: 4
  format: >-
    {{- $parts := split .Message ":" -}}
    {{- $head := index (split .Message "(") 0 -}}
    {{- $kind := trimsuffix (index (split $head ":") 0) "!" -}}
    {{- $label := "" -}}
    {{- if eq $kind "ci" -}}{{- $label = "CI" -}}
    {{- else if eq $kind "test" -}}{{- $label = "Tests" -}}
    {{- else if eq $kind "docs" -}}{{- $label = "Documentation" -}}
    {{- else if eq $kind "refactor" -}}{{- $label = "Refactors" -}}
    {{- else if or (eq $kind "chore") (eq $kind "style") (eq $kind "wip") -}}{{- $label = "Chores" -}}
    {{- end -}}
    {{- if $label -}}
    {{- $tail := "" -}}
    {{- range $i, $p := $parts -}}
    {{- if eq $i 1 -}}{{- $tail = $p -}}
    {{- else if gt $i 1 -}}{{- $tail = print $tail ":" $p -}}
    {{- end -}}
    {{- end -}}
    {{- $tail = trim $tail -}}
    **{{ $label }}** — {{ $tail }}
    {{- else -}}
    {{ .Message }}
    {{- end }}
  filters:
    exclude:
      - '^Merge '

snapshot:
  version_template: "{{ incpatch .Version }}-next"
