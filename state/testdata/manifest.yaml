environment:
  game_version: "1.21.1"
  server_core: ""
  server_core_version: ""
  modding_platform: neoforge
  modding_platform_version: "21.1.0"
  compatible_platforms:
    - fabric
    - mcdr
    - sinytra
  mcdr: false
  declared_capabilities: []
packages:
  - id: connector
    version: stable
    source: modrinth
    role: required
    side: both
    optional: false
    pinned: false
  - id: lithium
    version: beta
    source: github
    role: transitive
    side: server
    optional: true
    pinned: true
bundles:
  - name: default-config
    type: config
    path: config/defaults
    source: ./defaults/config
    optional: false
  - name: spawn-datapack
    type: datapack
    path: world/datapacks/spawn
    source: ./defaults/datapacks/spawn
    optional: true
