  - id: sponge
    source:
      url: https://raw.githubusercontent.com/SpongePowered/SpongeHome/afc7adbe8ac8ed591de65fee348914f52201ce6c/public/assets/img/icons/spongie-mark-reverse-dark.svg
      sha256: ccbaa0c79f4dfc2312a2de0cfb1ba58b39c2bacfbcff519c1aba5ce59238a6f7
    colors: 1

  # Mojang publishes the game icon only inside composite images; the
  # Minecraft Wiki copy is the official artwork on its own. Blur turns the
  # block texture into face shading.
  - id: vanilla
    source:
      url: https://minecraft.wiki/images/Java_Edition_icon_3.png
      sha256: 6e8f3498a7f871d6bd1c1b57a991a8d3766545ccf8397ab4768a6320ed6608f6
