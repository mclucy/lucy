  - id: spigot
    source:
      url: https://web.archive.org/web/20260925180524id_/https://static.spigotmc.org/img/spigot.png
      sha256: f5119cd6eb131daf92be7ece485e0c43075f922e3bd597dc77cac07d7ba56fd2
