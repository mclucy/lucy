    manifest_version: 1
    server:
      minecraft: "1.21.4"
      directory: server
      core:
        product: paper
        product_version: "232"
      packages:
        paper:
          modrinth:luckperms: "any"
          modrinth:multiverse-core: "any"
          modrinth:decentholograms: "any"
          modrinth:tabtps: "any"
          modrinth:plan: "any"
          modrinth:chunky: "any"
          modrinth:placeholderapi: "any"
          modrinth:coreprotect: "any"
          modrinth:worldguard: "any"
          modrinth:quality-tpa: "any"
  args:
    - "hangar:EngineHub/WorldEdit"

