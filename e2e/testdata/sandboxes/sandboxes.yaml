# Lucy sandboxes: real server directories materialized from pinned artifacts.
# Generate with `task sandboxes:gen`; output lands in .sandboxes/.
# Ecosystem notes for each family: docs/*.md.
#
# Forge and NeoForge maven hosts republish versioned coordinates in place and
# rewrite their checksum sidecars when they do. No immutable endpoint exists for
# these artifacts, so they carry no sha256 and the sandbox tool skips digest
# verification.
version: 1

sandboxes:
