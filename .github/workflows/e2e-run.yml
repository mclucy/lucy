# Reusable runner for one e2e matrix entry. The caller owns the matrix, the
# sandbox set, the suite command, and the artifact that carries the built CLI.
name: E2E Run

on:
  workflow_call:
    inputs:
      suite:
        description: Suite label shown in the job name.
        required: true
        type: string
      command:
        description: Shell command that runs the suite.
        required: true
        type: string
      timeout-minutes:
        description: Job timeout.
        required: false
        type: number
        default: 30
      sandboxes:
        description: Comma-separated sandbox ids to generate. Empty skips the fixtures.
        required: false
        type: string
        default: ""
      java-version:
        description: Single Temurin version to install. Empty skips Java.
        required: false
        type: string
        default: ""
      gradle:
        description: Install the pinned Gradle JDK inventory.
        required: false
        type: boolean
        default: false
      cache-key:
        description: Prefix for the Gradle cache key.
        required: false
        type: string
        default: ""
      cache-pattern:
        description: Path pattern whose contents key the Gradle cache. Empty skips the cache.
        required: false
        type: string
        default: ""
      binary-artifact:
        description: Name of the artifact that carries the built Lucy binary.
        required: false
        type: string
        default: lucy-e2e
      report-artifact:
        description: Name of the artifact that keeps heuristic reports. Empty skips the upload.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          cache: true

      - name: Install Temurin
        if: ${{ inputs.java-version != '' }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Install Temurin 17
        id: java17
        if: ${{ inputs.gradle }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          architecture: x64
          set-default: false

      - name: Install Temurin 21
        id: java21
        if: ${{ inputs.gradle }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          architecture: x64
          set-default: false

      - name: Install Temurin 25
        id: java25
        if: ${{ inputs.gradle }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          architecture: x64

      # Fixture builds are Gradle-heavy and share nothing between jobs, so a cold
      # cache blows the job timeout on the multi-loader fixtures. The key tracks the
      # fixture pins, so moving a commit starts over from a clean cache.
      - name: Restore Gradle cache
        if: ${{ inputs.gradle && inputs.cache-pattern != '' }}
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/lucy-gradle
          key: gradle-${{ inputs.cache-key }}-${{ hashFiles(inputs.cache-pattern) }}

      # Pin majors, not exact patches: Lucy's toolchain selection matches on Java major
      # version only, and Adoptium re-tags LTS releases (e.g. 21.0.8+9 became
      # 21.0.8+9.0.LTS), so exact patch pins silently stop resolving.
      - name: Configure pinned JDK inventory
        if: ${{ inputs.gradle }}
        env:
          JDK17: ${{ steps.java17.outputs.path }}
          JDK21: ${{ steps.java21.outputs.path }}
          JDK25: ${{ steps.java25.outputs.path }}
        run: bash scripts/ci-gradle-inventory.sh

      - name: Cache sandbox downloads
        if: ${{ inputs.sandboxes != '' }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/lucy-sandbox
          key: sandbox-${{ hashFiles('e2e/testdata/sandboxes/sandboxes.yaml') }}

      # The generator skips an output directory that already exists, so a restored
      # set of complete sandboxes skips the installer work. The key tracks the
      # requested set, the manifest, the fixtures, and the generator; a cache key
      # cannot carry commas, so the set is spelled with dashes.
      - name: Resolve sandbox cache set
        if: ${{ inputs.sandboxes != '' }}
        id: sandbox-cache
        env:
          SANDBOXES: ${{ inputs.sandboxes }}
        run: echo "set=$(printf '%s' "$SANDBOXES" | tr ',' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache generated sandboxes
        if: ${{ inputs.sandboxes != '' }}
        uses: actions/cache@v6
        with:
          path: .sandboxes
          key: sandboxes-${{ steps.sandbox-cache.outputs.set }}-${{ hashFiles('e2e/testdata/sandboxes/**', 'e2e/sandbox/**') }}

      - name: Generate sandboxes
        if: ${{ inputs.sandboxes != '' }}
        env:
          SANDBOXES: ${{ inputs.sandboxes }}
        run: go run ./e2e/sandbox --only "$SANDBOXES"

      - name: Download Lucy
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.binary-artifact }}
          path: dist

      - name: Restore Lucy
        run: |
          set -euo pipefail
          mv dist/lucy-e2e-binary dist/lucy
          chmod +x dist/lucy
          ./dist/lucy --version

      # Reports live under runner.temp, outside the checkout, for the upload step below.
      - name: Run suite
        shell: bash
        env:
          LUCY_HEURISTIC_REPORT_DIR: ${{ runner.temp }}/lucy-heuristic
        run: ${{ inputs.command }}

      - name: Upload heuristic reports
        if: ${{ always() && inputs.report-artifact != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.report-artifact }}
          path: ${{ runner.temp }}/lucy-heuristic
          if-no-files-found: error
          retention-days: 90
