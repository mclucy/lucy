name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Set up Task
        uses: go-task/setup-task@v1

      - name: Run CI checks
        run: task ci:test

      - name: Prepare cipher embedding
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          set -euo pipefail
          task cipher:generate
          KEY=$(cut -d= -f2 .cipher_key)
          TEXT=$(cut -d= -f2 .cipher_ciphertext)
          echo "::add-mask::${KEY}"
          echo "::add-mask::${TEXT}"
          {
            printf 'CIPHER_KEY=%s\n' "${KEY}"
            printf 'CIPHER_CIPHERTEXT=%s\n' "${TEXT}"
          } >> "${GITHUB_ENV}"

      - name: Run GoReleaser
        run: go tool goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
