name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Published tag to mirror to R2
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        if: github.event_name == 'push'
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Set up Task
        if: github.event_name == 'push'
        uses: go-task/setup-task@v2

      - name: Run CI checks
        if: github.event_name == 'push'
        run: task ci:test

      - name: Prepare cipher embedding
        if: github.event_name == 'push'
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -euo pipefail
          # Tag identity for AD binding: version without leading v and checked-out commit.
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          COMMIT="$(git rev-parse HEAD)"
          export CIPHER_RELEASE_VERSION="${VERSION}"
          export CIPHER_RELEASE_COMMIT="${COMMIT}"
          task cipher:generate
          KEY_A=$(sed -n 's/^cipher_key_a=//p' .cipher_key)
          KEY_B=$(sed -n 's/^cipher_key_b=//p' .cipher_key)
          CT_A=$(sed -n 's/^cipher_ciphertext_a=//p' .cipher_key)
          CT_B=$(sed -n 's/^cipher_ciphertext_b=//p' .cipher_key)
          if [ -z "$KEY_A" ] || [ -z "$KEY_B" ] || [ -z "$CT_A" ] || [ -z "$CT_B" ]; then
            echo "cipher: incomplete fragments after generate" >&2
            exit 1
          fi
          echo "::add-mask::${KEY_A}"
          echo "::add-mask::${KEY_B}"
          echo "::add-mask::${CT_A}"
          echo "::add-mask::${CT_B}"
          {
            printf 'CIPHER_KEY_A=%s\n' "${KEY_A}"
            printf 'CIPHER_KEY_B=%s\n' "${KEY_B}"
            printf 'CIPHER_CIPHERTEXT_A=%s\n' "${CT_A}"
            printf 'CIPHER_CIPHERTEXT_B=%s\n' "${CT_B}"
          } >> "${GITHUB_ENV}"

      - name: Run GoReleaser
        if: github.event_name == 'push'
        run: go tool goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Mirror release artifacts to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          version="${tag#v}"
          mkdir -p release-assets
          gh release download "$tag" --repo "${GITHUB_REPOSITORY}" --dir release-assets
          npm ci --prefix assets --no-audit --no-fund
          for file in release-assets/*; do
            name="$(basename "$file")"
            case "$name" in
              *.tar.gz) type=application/gzip ;;
              *.zip) type=application/zip ;;
              *) type=text/plain ;;
            esac
            assets/node_modules/.bin/cf r2 objects put "v${version}/${name}" \
              --bucket-name lucy-releases --file "$file" --content-type "$type"
          done
