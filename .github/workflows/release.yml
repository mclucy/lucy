name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Run CI checks
        run: task ci:test

      - name: Prepare cipher embedding
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          set -euo pipefail
          # Tag identity for AD binding: version without leading v and checked-out commit.
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          COMMIT="$(git rev-parse HEAD)"
          export CIPHER_RELEASE_VERSION="${VERSION}"
          export CIPHER_RELEASE_COMMIT="${COMMIT}"
          task cipher:generate
          KEY_A=$(sed -n 's/^cipher_key_a=//p' .cipher_key)
          KEY_B=$(sed -n 's/^cipher_key_b=//p' .cipher_key)
          CT_A=$(sed -n 's/^cipher_ciphertext_a=//p' .cipher_key)
          CT_B=$(sed -n 's/^cipher_ciphertext_b=//p' .cipher_key)
          if [ -z "$CT_A" ] && [ -f .cipher_ciphertext ]; then
            CT_A=$(sed -n 's/^cipher_ciphertext_a=//p' .cipher_ciphertext)
            CT_B=$(sed -n 's/^cipher_ciphertext_b=//p' .cipher_ciphertext)
          fi
          if [ -z "$KEY_A" ] || [ -z "$KEY_B" ] || [ -z "$CT_A" ] || [ -z "$CT_B" ]; then
            echo "cipher: incomplete fragments after generate" >&2
            exit 1
          fi
          echo "::add-mask::${KEY_A}"
          echo "::add-mask::${KEY_B}"
          echo "::add-mask::${CT_A}"
          echo "::add-mask::${CT_B}"
          {
            printf 'CIPHER_KEY_A=%s\n' "${KEY_A}"
            printf 'CIPHER_KEY_B=%s\n' "${KEY_B}"
            printf 'CIPHER_CIPHERTEXT_A=%s\n' "${CT_A}"
            printf 'CIPHER_CIPHERTEXT_B=%s\n' "${CT_B}"
          } >> "${GITHUB_ENV}"

      - name: Run GoReleaser
        run: go tool goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
