name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Published tag to mirror to R2
        required: true
      announce:
        description: Post the release announcement to Discord again
        type: boolean
        default: false
      revoke:
        description: Exclude this tag from latest selection
        type: boolean
        default: false
      unrevoke:
        description: Remove an existing exclusion for this tag
        type: boolean
        default: false
      reason:
        description: Why the release is being excluded
        type: string
        default: manual revocation

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: github.event_name == 'push' || (github.event.inputs.revoke != 'true' && github.event.inputs.unrevoke != 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        if: github.event_name == 'push'
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Set up Task
        if: github.event_name == 'push'
        uses: go-task/setup-task@v2

      - name: Run CI checks
        if: github.event_name == 'push'
        run: task ci:test

      - name: Prepare cipher embedding
        if: github.event_name == 'push'
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: bash scripts/ci-cipher-export.sh

      - name: Check Homebrew tap credentials
        if: github.event_name == 'push'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is required to publish the Homebrew cask"
            exit 1
          fi

      - name: Check Discord webhook
        if: github.event_name == 'push' || github.event.inputs.announce == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: bash scripts/ci-check-discord-webhook.sh

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve GoReleaser version
        if: github.event_name == 'push'
        id: goreleaser
        run: echo "version=$(go list -m -f '{{.Version}}' github.com/goreleaser/goreleaser/v2)" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        if: github.event_name == 'push'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ steps.goreleaser.outputs.version }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Mirror release artifacts to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: bash scripts/release-mirror-r2.sh

      # It runs after the R2 mirror, so the install command in the message
      # already resolves. A transient Discord failure must not turn a published
      # release red: the annotation reports it and the `announce` dispatch input
      # retries it.
      - name: Announce release to Discord
        if: github.event_name == 'push' || github.event.inputs.announce == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: bash scripts/release-announce-discord.sh

  revoke:
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.revoke == 'true' || github.event.inputs.unrevoke == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Install Cloudflare CLI
        run: npm ci --prefix assets --no-audit --no-fund

      - name: Update release eligibility
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_UNREVOKE: ${{ github.event.inputs.unrevoke }}
          INPUT_REASON: ${{ github.event.inputs.reason }}
        run: bash scripts/release-revoke-r2.sh
