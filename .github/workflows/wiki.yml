# The GitHub wiki is generated from the Mintlify pages under docs/. Never edit
# wiki pages in the browser: the next synchronization deletes them.
name: Wiki

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('wiki-pr-{0}', github.run_id) || 'wiki' }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          # This job compiles one generator. Sharing the repository-wide Go
          # cache key would freeze it at that generator's dependency subset.
          cache: false

      - name: Render wiki pages
        run: go run ./tools/genwiki -out "$RUNNER_TEMP/wiki"

      - name: Publish wiki mirror
        if: >-
          github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'master'))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-publish-wiki.sh
