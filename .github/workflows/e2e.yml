name: E2E

on:
  push:
    branches: [main]
    paths:
      - tools/envgen/**
      - e2e/testdata/environments/**
      - workspace/**
      - internal/cli/**
      - e2e/**
      - .github/workflows/e2e.yml
  pull_request:
    paths:
      - tools/envgen/**
      - e2e/testdata/environments/**
      - workspace/**
      - internal/cli/**
      - e2e/**
      - .github/workflows/e2e.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Environment probe: generate each fetchable sandbox from pinned artifacts
  # and verify Lucy's CLI output against native assertions in e2e/.
  #
  # Manual-artifact environments (fabric-installed-1214, fabric-installed-262,
  # fabric-installed-114) are excluded: their pinned jars cannot be fetched in CI.
  probe:
    if: "!startsWith(github.event.head_commit.message, 'docs:') && !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'docs:'))"
    runs-on: ubuntu-latest
    env:
      ENVS: arclight-fabric,arclight-forge,arclight-neoforge,fabric-executable-1214,fabric-executable-262,forge-1201,forge-12111,neoforge-211,neoforge-262,mcdr-fabric,mcdr-forge,mcdr-neoforge
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Cache envgen downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/lucy-envgen
          key: envgen-${{ hashFiles('e2e/testdata/environments/environments.yaml') }}

      - name: Generate environments
        run: task envs:gen -- --only ${{ env.ENVS }}

      - name: Build lucy
        run: |
          if [ -n "${CF_API_KEY:-}" ]; then
            task cipher:generate
          fi
          task build:dev
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

      - name: Verify probe (e2e)
        run: go run ./e2e/init ${{ env.ENVS }}
