# Layer 2: pick the e2e domains whose inputs changed and hand the resulting
# matrix to the reusable runner. The top-level CI calls this workflow.
name: E2E

on:
  workflow_call:
    inputs:
      force:
        description: Run every domain regardless of changed paths.
        required: false
        type: boolean
        default: false
      compile-full:
        description: Run every compile fixture instead of the smoke layer.
        required: false
        type: boolean
        default: false
    secrets:
      CURSEFORGE_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  # One job detects the changed domains and plans the matrix: both steps only
  # read the repository, so a second runner would buy a checkout and nothing else.
  plan:
    name: Plan suites
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The filters mirror the paths each suite is built from. The init and mutation
      # suites run the real CLI binary, so they share its full dependency closure:
      # every package the CLI command tree links, not only the packages their own
      # test directories name. A change that matches no filter runs no e2e domain.
      - name: Filter changed domains
        id: filter
        if: ${{ !inputs.force }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            mutation:
              - '.github/workflows/ci.yml'
              - '.github/workflows/e2e-run.yml'
              - '.github/workflows/e2e.yml'
              - 'artifact/**'
              - 'artifactstore/**'
              - 'bootstrap/**'
              - 'cache/**'
              - 'cas/**'
              - 'catalog/**'
              - 'cmd/*.go'
              - 'config/**'
              - 'document/**'
              - 'e2e/internal/**'
              - 'e2e/mutation/**'
              - 'filetrack/**'
              - 'go.mod'
              - 'go.sum'
              - 'input/**'
              - 'install/**'
              - 'internal/appdata/**'
              - 'internal/bisect/**'
              - 'internal/cli/**'
              - 'internal/depgraph/**'
              - 'internal/fileschema/**'
              - 'internal/fn/**'
              - 'internal/fsutil/**'
              - 'internal/github/**'
              - 'internal/javainstall/**'
              - 'internal/maven/**'
              - 'internal/shell/**'
              - 'internal/telemetry/**'
              - 'internal/toolchain/**'
              - 'internal/workspaceguard/**'
              - 'internal/workspacewrite/**'
              - 'java/**'
              - 'javaruntime/**'
              - 'log/**'
              - 'operation/**'
              - 'receipt/**'
              - 'resolve/**'
              - 'scripts/**'
              - 'server/**'
              - 'serverregistry/**'
              - 'Taskfile.yml'
              - 'terminal/**'
              - 'upstream/**'
              - 'version/**'
              - 'workspace/**'
            init:
              - '.github/workflows/ci.yml'
              - '.github/workflows/e2e-run.yml'
              - '.github/workflows/e2e.yml'
              - 'artifact/**'
              - 'artifactstore/**'
              - 'bootstrap/**'
              - 'cache/**'
              - 'cas/**'
              - 'catalog/**'
              - 'cmd/*.go'
              - 'config/**'
              - 'document/**'
              - 'e2e/init/**'
              - 'e2e/internal/**'
              - 'e2e/sandbox/**'
              - 'e2e/testdata/sandboxes/**'
              - 'filetrack/**'
              - 'go.mod'
              - 'go.sum'
              - 'input/**'
              - 'install/**'
              - 'internal/appdata/**'
              - 'internal/bisect/**'
              - 'internal/cli/**'
              - 'internal/depgraph/**'
              - 'internal/fileschema/**'
              - 'internal/fn/**'
              - 'internal/fsutil/**'
              - 'internal/github/**'
              - 'internal/javainstall/**'
              - 'internal/maven/**'
              - 'internal/shell/**'
              - 'internal/telemetry/**'
              - 'internal/toolchain/**'
              - 'internal/workspaceguard/**'
              - 'internal/workspacewrite/**'
              - 'java/**'
              - 'javaruntime/**'
              - 'log/**'
              - 'operation/**'
              - 'receipt/**'
              - 'resolve/**'
              - 'scripts/**'
              - 'server/**'
              - 'serverregistry/**'
              - 'Taskfile.yml'
              - 'terminal/**'
              - 'upstream/**'
              - 'version/**'
              - 'workspace/**'
            compile:
              - '.github/workflows/ci.yml'
              - '.github/workflows/e2e-run.yml'
              - '.github/workflows/e2e.yml'
              - 'cmd/*.go'
              - 'e2e/compile/**'
              - 'e2e/internal/**'
              - 'e2e/testdata/repo/**'
              - 'go.mod'
              - 'go.sum'
              - 'internal/buildrepo/**'
              - 'internal/cli/*.go'
              - 'internal/cli/compile/**'
              - 'internal/telemetry/**'
              - 'internal/toolchain/**'
              - 'scripts/**'
              - 'Taskfile.yml'
              - 'terminal/report/**'

      # The suite derives its cases from the same manifests, so its matrix and a
      # local `go test ./e2e/compile` can never disagree about which fixtures exist.
      - name: Plan suite matrix
        id: plan
        env:
          DOMAINS: ${{ inputs.force && '["mutation","init","compile"]' || steps.filter.outputs.changes }}
          COMPILE_FULL: ${{ inputs.compile-full || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:compile-full')) }}
        run: bash scripts/e2e-plan.sh

  build:
    name: Build Lucy
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '' && needs.plan.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          cache: true

      - name: Set up Task
        uses: go-task/setup-task@v2

      # Only the build reads the key: it is bound into the binary as cipher
      # material, so suite runs never receive it.
      - name: Build Lucy
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: bash scripts/ci-build-lucy.sh

      - name: Stage binary
        run: cp "dist/lucy-$(go env GOOS)-$(go env GOARCH)" dist/lucy-e2e-binary

      - name: Upload Lucy
        uses: actions/upload-artifact@v7
        with:
          name: lucy-e2e
          path: dist/lucy-e2e-binary
          if-no-files-found: error
          retention-days: 1

  run:
    name: ${{ matrix.group }}
    needs: [plan, build]
    if: ${{ needs.plan.outputs.matrix != '' && needs.plan.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/e2e-run.yml
    with:
      suite: ${{ matrix.suite }}
      command: ${{ matrix.command }}
      timeout-minutes: ${{ matrix.timeout }}
      sandboxes: ${{ matrix.sandboxes }}
      java-version: ${{ matrix.java }}
      gradle: ${{ matrix.gradle }}
      cache-key: ${{ matrix.cache-key }}
      cache-pattern: ${{ matrix.cache-pattern }}
      binary-artifact: lucy-e2e
      report-artifact: ${{ matrix.report-artifact }}
