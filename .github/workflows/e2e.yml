# Layer 2: pick the e2e domains whose inputs changed and hand the resulting
# matrix to the reusable runner. The top-level CI calls this workflow.
name: E2E

on:
  workflow_call:
    inputs:
      force:
        description: Run every domain regardless of changed paths.
        required: false
        type: boolean
        default: false
      compile-full:
        description: Run every compile fixture instead of the smoke layer.
        required: false
        type: boolean
        default: false
    secrets:
      CURSEFORGE_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed domains
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      domains: ${{ inputs.force && '["status","init","install","compile"]' || steps.filter.outputs.changes }}
      compile-full: ${{ inputs.compile-full || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:compile-full')) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The filters mirror the paths each suite is built from. A change that
      # matches no filter runs no e2e domain, as before the split.
      - name: Filter changed domains
        id: filter
        if: ${{ !inputs.force }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            status:
              - 'e2e/status/**'
              - 'artifact/**'
              - 'e2e/sandbox/**'
              - 'e2e/internal/**'
              - 'e2e/testdata/sandboxes/**'
              - 'workspace/**'
              - 'document/**'
              - 'config/**'
              - 'operation/**'
              - 'cmd/*.go'
              - 'internal/cli/*.go'
              - 'internal/telemetry/**'
              - 'terminal/report/**'
              - 'go.mod'
              - 'go.sum'
              - 'Taskfile.yml'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/e2e.yml'
              - '.github/workflows/e2e-run.yml'
            init:
              - 'e2e/init/**'
              - 'artifact/**'
              - 'artifactstore/**'
              - 'cas/**'
              - 'serverregistry/**'
              - 'e2e/sandbox/**'
              - 'e2e/internal/**'
              - 'e2e/testdata/sandboxes/**'
              - 'operation/**'
              - 'document/**'
              - 'config/**'
              - 'workspace/**'
              - 'resolve/**'
              - 'upstream/**'
              - 'cmd/*.go'
              - 'internal/cli/*.go'
              - 'internal/github/**'
              - 'internal/telemetry/**'
              - 'terminal/report/**'
              - 'go.mod'
              - 'go.sum'
              - 'Taskfile.yml'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/e2e.yml'
              - '.github/workflows/e2e-run.yml'
            install:
              - 'e2e/install/**'
              - 'artifact/**'
              - 'artifactstore/**'
              - 'cas/**'
              - 'serverregistry/**'
              - 'e2e/sandbox/**'
              - 'e2e/internal/**'
              - 'e2e/testdata/sandboxes/**'
              - 'install/**'
              - 'bootstrap/**'
              - 'document/**'
              - 'config/**'
              - 'resolve/**'
              - 'upstream/**'
              - 'operation/**'
              - 'workspace/**'
              - 'cmd/*.go'
              - 'internal/cli/*.go'
              - 'internal/github/**'
              - 'internal/javainstall/**'
              - 'internal/telemetry/**'
              - 'terminal/report/**'
              - 'go.mod'
              - 'go.sum'
              - 'Taskfile.yml'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/e2e.yml'
              - '.github/workflows/e2e-run.yml'
            compile:
              - 'e2e/compile/**'
              - 'e2e/internal/**'
              - 'e2e/testdata/repo/**'
              - 'internal/cli/compile/**'
              - 'internal/buildrepo/**'
              - 'internal/toolchain/**'
              - 'cmd/*.go'
              - 'internal/cli/*.go'
              - 'internal/telemetry/**'
              - 'terminal/report/**'
              - 'go.mod'
              - 'go.sum'
              - 'Taskfile.yml'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/e2e.yml'
              - '.github/workflows/e2e-run.yml'

  plan:
    name: Plan suites
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The suite derives its cases from the same manifests, so its matrix and a
      # local `go test ./e2e/compile` can never disagree about which fixtures exist.
      - name: Plan suite matrix
        id: plan
        env:
          DOMAINS: ${{ needs.changes.outputs.domains }}
          COMPILE_FULL: ${{ needs.changes.outputs.compile-full }}
        run: bash scripts/e2e-plan.sh

  build:
    name: Build Lucy
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '' && needs.plan.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          cache: true

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Build Lucy
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: bash scripts/ci-build-lucy.sh

      - name: Stage binary
        run: cp "dist/lucy-$(go env GOOS)-$(go env GOARCH)" dist/lucy-e2e-binary

      - name: Upload Lucy
        uses: actions/upload-artifact@v7
        with:
          name: lucy-e2e
          path: dist/lucy-e2e-binary
          if-no-files-found: error
          retention-days: 1

  run:
    name: ${{ matrix.group }}
    needs: [plan, build]
    if: ${{ needs.plan.outputs.matrix != '' && needs.plan.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/e2e-run.yml
    with:
      suite: ${{ matrix.suite }}
      command: ${{ matrix.command }}
      timeout-minutes: ${{ matrix.timeout }}
      sandboxes: ${{ matrix.sandboxes }}
      java-version: ${{ matrix.java }}
      gradle: ${{ matrix.gradle }}
      cache-key: ${{ matrix.cache-key }}
      cache-pattern: ${{ matrix.cache-pattern }}
      binary-artifact: lucy-e2e
    secrets:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
