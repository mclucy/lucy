name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    if: "!startsWith(github.event.head_commit.message, 'docs:') && !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'docs:'))"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Run CI checks
        run: task ci:test
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Go
          label: code-coverage/go

  build:
    if: "!startsWith(github.event.head_commit.message, 'docs:') && !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'docs:'))"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Build release artifacts
        run: task ci:build
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

      - name: Upload linux-amd64
        uses: actions/upload-artifact@v7
        with:
          name: lucy-linux-amd64
          path: release/lucy-linux-amd64.gz

      - name: Upload windows-amd64
        uses: actions/upload-artifact@v7
        with:
          name: lucy-windows-amd64
          path: release/lucy-windows-amd64.exe.gz

      - name: Upload darwin-amd64
        uses: actions/upload-artifact@v7
        with:
          name: lucy-darwin-amd64
          path: release/lucy-darwin-amd64.gz

      - name: Upload darwin-arm64
        uses: actions/upload-artifact@v7
        with:
          name: lucy-darwin-arm64
          path: release/lucy-darwin-arm64.gz
