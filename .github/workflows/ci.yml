name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    if: "!startsWith(github.event.head_commit.message, 'docs:') && !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'docs:')) && !(github.event_name == 'pull_request' && github.event.action == 'labeled')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      code-quality: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Run CI checks
        run: task ci:test
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Go
          label: code-coverage/go

      - name: Generate coverage badge
        if: github.event_name != 'pull_request'
        uses: ncruces/go-coverage-report@v0
        with:
          output-dir: badge
          coverage-file: cover.out
          badge-title: Coverage
          amend: true

  build:
    if: "!startsWith(github.event.head_commit.message, 'docs:') && !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'docs:')) && !(github.event_name == 'pull_request' && github.event.action == 'labeled')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Build release artifacts
        run: task ci:build
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      - name: Upload linux-amd64
        uses: actions/upload-artifact@v7
        with:
          name: lucy-linux-amd64
          path: release/lucy-linux-amd64.gz

      - name: Upload windows-amd64
        uses: actions/upload-artifact@v7
        with:
          name: lucy-windows-amd64
          path: release/lucy-windows-amd64.exe.gz

      - name: Upload darwin-amd64
        uses: actions/upload-artifact@v7
        with:
          name: lucy-darwin-amd64
          path: release/lucy-darwin-amd64.gz

      - name: Upload darwin-arm64
        uses: actions/upload-artifact@v7
        with:
          name: lucy-darwin-arm64
          path: release/lucy-darwin-arm64.gz

  e2e:
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && contains(github.event.pull_request.labels.*.name, 'ci:compile-full'))
      || (
        !startsWith(github.event.head_commit.message, 'docs:')
        && !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'docs:'))
        && !(github.event_name == 'pull_request' && github.event.action == 'labeled')
      )
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/e2e.yml
    with:
      force: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

  bin-size:
    if: >-
      github.event_name == 'pull_request'
      && !startsWith(github.event.pull_request.title, 'docs:')
      && github.event.action != 'labeled'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/bin-size.yml
    secrets:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

  manifest-schema:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref_name == 'main' || github.ref_name == 'master')
    permissions:
      contents: write
    uses: ./.github/workflows/manifest-schema.yml

  wiki:
    needs: test
    if: >-
      always()
      && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/'))
        || github.event_name == 'pull_request'
        || github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: write
    uses: ./.github/workflows/wiki.yml
