name: manifest-schema

on:
  push:
    branches:
      - main
    paths:
      - "manifest/*"
      - .github/workflows/manifest-schema.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Regenerate manifest schema
        run: go run ./tools/genmanifestschema

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest/manifest.schema.json
          if git diff --cached --quiet; then
            echo "Manifest schema is up to date."
          else
            git commit -m "chore(manifest): regenerate schema"
            git push origin HEAD:main
          fi

