name: manifest-schema

on:
  workflow_call:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ github.token }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # This job compiles one generator. Sharing the repository-wide Go
          # cache key would freeze it at that generator's dependency subset.
          cache: false

      - name: Regenerate manifest schema
        run: go run ./tools/genmanifestschema

      - name: Commit if changed
        run: bash scripts/ci-commit-schema.sh

