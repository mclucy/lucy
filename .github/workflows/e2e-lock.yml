name: E2E Lock

on:
  push:
    branches: [main]
    paths:
      - e2e/**
      - "**/*.go"
      - go.mod
      - go.sum
      - Taskfile.yml
      - .github/workflows/e2e-lock.yml
  pull_request:
    paths:
      - e2e/**
      - "**/*.go"
      - go.mod
      - go.sum
      - Taskfile.yml
      - .github/workflows/e2e-lock.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fresh-install lock scenarios: generate the pinned sandboxes, build Lucy,
  # then install each scenario manifest in a disposable workspace and verify the
  # generated lock and runtime files against the pinned bytes.
  #
  # Java 21 is the strictest minimum across the scenarios (1.20.1 cores need
  # 17, 1.21.x cores need 21) and also drives the Forge and NeoForge installer
  # processors during bootstrap.
  lock:
    if: "!startsWith(github.event.head_commit.message, 'docs:') && !(github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'docs:'))"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SANDBOXES: vanilla-1201,forge-1201,neoforge-211
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          cache: true

      - name: Install Temurin 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Cache sandbox downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/lucy-sandbox
          key: sandbox-${{ hashFiles('e2e/testdata/sandboxes/sandboxes.yaml') }}

      - name: Generate sandboxes
        run: task sandboxes:gen -- --only ${{ env.SANDBOXES }}

      - name: Build lucy
        run: |
          if [ -n "${CF_API_KEY:-}" ]; then
            task cipher:generate
          fi
          task build:dev
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

      # No scenario ids: the suite defaults to all scenarios and fails loudly
      # when a scenario lacks its generated environment, so this list and the
      # suite cannot silently drift apart.
      - name: Lock scenarios (e2e)
        run: go run ./e2e/lock --p 2
