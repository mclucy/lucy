name: Deploy static assets

on:
  push:
    branches:
      - main
    paths:
      - assets/**
      - document/document_manifest.schema.json
      - .github/workflows/static-assets.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-assets
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare schema
        run: cp document/document_manifest.schema.json assets/public/manifest.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: assets/package-lock.json
      - name: Install deployment tools
        working-directory: assets
        run: npm ci
      - name: Deploy worker
        working-directory: assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx cf deploy
