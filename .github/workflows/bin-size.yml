name: Binary Size

on:
  workflow_call:
    secrets:
      CF_API_KEY:
        required: false
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  compare:
    name: Compare binary size
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out PR
        uses: actions/checkout@v7
        with:
          path: pr

      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref || 'main' }}
          path: main

      - name: Check for go.mod changes
        id: check_gomod
        run: |
          if ! cmp -s pr/go.mod main/go.mod || ! cmp -s pr/go.sum main/go.sum; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "go.mod or go.sum has changed on this PR."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "go.mod and go.sum are unchanged."
          fi

      - name: Set up Go
        if: steps.check_gomod.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Compare binary sizes and report
        if: steps.check_gomod.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/pr-bins /tmp/main-bins

          python3 - <<'EOF'
          import os, subprocess

          targets = [
              ("linux-amd64", "linux", "amd64", ""),
              ("linux-arm64", "linux", "arm64", ""),
              ("darwin-arm64", "darwin", "arm64", ""),
              ("darwin-amd64", "darwin", "amd64", ""),
              ("windows-amd64", "windows", "amd64", ".exe"),
          ]

          for name, goos, goarch, ext in targets:
              out = f"/tmp/pr-bins/lucy-{name}{ext}"
              cmd = ["go", "build", "-trimpath", "-ldflags=-w -s", "-tags=release,nethttpomithttp2", "-o", out]
              subprocess.run(cmd, cwd="pr", check=True)

          for name, goos, goarch, ext in targets:
              out = f"/tmp/main-bins/lucy-{name}{ext}"
              cmd = ["go", "build", "-trimpath", "-ldflags=-w -s", "-tags=release,nethttpomithttp2", "-o", out]
              subprocess.run(cmd, cwd="main", check=True)

          def fmt(b):
              if abs(b) >= 1024 * 1024:
                  return f"{b / (1024*1024):.2f} MB"
              elif abs(b) >= 1024:
                  return f"{b / 1024:.1f} KB"
              return f"{b} B"

          rows = []
          for name, goos, goarch, ext in targets:
              m_sz = os.path.getsize(f"/tmp/main-bins/lucy-{name}{ext}")
              p_sz = os.path.getsize(f"/tmp/pr-bins/lucy-{name}{ext}")
              diff = p_sz - m_sz
              pct = (diff / m_sz) * 100 if m_sz else 0
              sign = "+" if diff > 0 else ""
              indicator = "🟢" if diff < 0 else ("🔴" if diff > 0 else "⚪")
              rows.append(f"| `{name}` | {fmt(m_sz)} ({m_sz:,} B) | {fmt(p_sz)} ({p_sz:,} B) | **{sign}{fmt(diff)} ({sign}{pct:.2f}%)** {indicator} |")

          table = "\n".join(rows)
          body = f"""### 📦 Binary Size Report (compared against `main`)

          | Target | `main` | PR | Change |
          | :--- | :--- | :--- | :--- |
          {table}

          *Automated check triggered by changes to `go.mod` / `go.sum`.*
          <!-- lucy-binary-size-report -->
          """

          with open("/tmp/report.md", "w") as f:
              f.write(body)
          EOF

          if [ -n "$PR_NUMBER" ]; then
            COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.body | contains("<!-- lucy-binary-size-report -->")) | .id' | head -n 1 || true)
            if [ -n "$COMMENT_ID" ]; then
              gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -F body=@/tmp/report.md || true
            else
              gh pr comment "$PR_NUMBER" --body-file /tmp/report.md || true
            fi
          fi

          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
