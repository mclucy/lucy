name: Binary Size

on:
  workflow_call:
    secrets:
      CURSEFORGE_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  compare:
    name: Compare binary size
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out PR
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: pr

      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.base_ref || 'main' }}
          persist-credentials: false
          path: main
      - name: Check for go.mod changes
        id: check_gomod
        run: |
          if ! cmp -s pr/go.mod main/go.mod || ! cmp -s pr/go.sum main/go.sum; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "go.mod or go.sum has changed on this PR."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "go.mod and go.sum are unchanged."
          fi

      - name: Set up Go
        if: steps.check_gomod.outputs.changed == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: pr/go.sum

      - name: Compare binary sizes
        if: steps.check_gomod.outputs.changed == 'true'
        run: bash pr/scripts/ci-bin-size-report.sh

      - name: Publish report to pull request
        if: steps.check_gomod.outputs.changed == 'true' && github.event.pull_request.number != ''
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash pr/scripts/ci-publish-bin-size-report.sh
