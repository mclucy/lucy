# https://taskfile.dev

version: "3"
interval: 700ms

dotenv:
  - ".env"

vars:
  DEV_GOOS:
    sh: go env GOOS
  DEV_GOARCH:
    sh: go env GOARCH
  DEV_BINARY: dist/lucy-{{.DEV_GOOS}}-{{.DEV_GOARCH}}
  DEV_SYMLINK: dist/lucy
  # Syntax highlighting is stripped at build time; see _patches/glamour.
  GLAMOUR_BUILD_DIR: .build/glamour
  GLAMOUR_MODFILE: "{{.GLAMOUR_BUILD_DIR}}/build.mod"

tasks:
  glamour:patch:
    desc: Materialize the chroma-free glamour module used by size-trimmed builds
    internal: true
    cmds:
      - sh _patches/glamour/materialize.sh
    sources:
      - "_patches/glamour/*"
      - go.mod
      - go.sum
    generates:
      - "{{.GLAMOUR_MODFILE}}"
      - "{{.GLAMOUR_BUILD_DIR}}/build.sum"
      - "{{.GLAMOUR_BUILD_DIR}}/module/go.mod"

  build:
    desc: Build the local development binary for the host platform
    deps:
      - glamour:patch
    cmds:
      - bash scripts/build-dev.sh
    sources: &build_sources
      - "./**/*.go"
      - "./internal/cli/compile/*.gradle"
      - "./docs/**/*.mdx"
      - "./_patches/glamour/*"
      - "./scripts/*.sh"
      - "./go.mod"
      - "./go.sum"
    generates:
      - "{{.DEV_BINARY}}"
      - "{{.DEV_SYMLINK}}"

  dev:
    desc: Alias for build
    deps:
      - build

  build:watch:
    desc: Rebuild the local development binary on Go and docs changes
    cmds:
      - task build
    watch: true
    # Anchored to the build source list so the two cannot drift.
    sources: *build_sources
    method: timestamp

  build:release:
    desc: Build release binaries for Windows, Linux, and macOS
    deps:
      - clean:release
      - docs:pack
      - glamour:patch
    cmds:
      - bash scripts/build-release.sh

  clean:
    desc: Remove all generated build artifacts
    deps:
      - clean:build
      - clean:dist
      - clean:release

  clean:build:
    desc: Remove the generated glamour module
    cmds:
      - rm -rf .build

  clean:dist:
    desc: Remove development build artifacts
    cmds:
      - rm -rf dist

  clean:release:
    desc: Remove release build artifacts
    cmds:
      - rm -rf release

  run:
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    desc: Run the local latest codebase with the provided arguments
    deps:
      - glamour:patch
    cmds:
      - go run -modfile={{.TASKFILE_DIR}}/{{.GLAMOUR_MODFILE}} {{.TASKFILE_DIR}} {{.CLI_ARGS}}

  cipher:generate:
    silent: true
    desc: Generate cipher material from CURSEFORGE_API_KEY (bound when CIPHER_RELEASE_VERSION and CIPHER_RELEASE_COMMIT are set)
    cmds:
      - bash scripts/cipher-generate.sh
    generates:
      - .cipher_key

  cipher:verify-key:
    silent: true
    desc: Report whether CURSEFORGE_API_KEY is accepted by the CurseForge API
    cmds:
      - bash scripts/cipher-verify-key.sh

  test:
    desc: Run the Go test suite
    cmds:
      - go test ./...

  test:race:
    desc: Run the Go test suite with the race detector
    cmds:
      - go test -race ./...

  test:coverage:
    desc: Run the Go test suite with a coverage profile
    cmds:
      - go test -coverprofile=cover.out ./...
      - go tool gocover-cobertura < cover.out > coverage.xml

  lint:
    desc: Run static analysis and enforce package dependency boundaries
    cmds:
      - go tool golangci-lint run --config .golangci.yml {{default "./..." .CLI_ARGS}}

  check:
    desc: Run the default local verification tasks
    deps:
      - build
      - test:race
      - lint

  sandboxes:list:
    desc: List sandboxes defined in the manifest
    cmds:
      - go run ./e2e/sandbox --list

  sandboxes:gen:
    desc: Materialize sandboxes into .sandboxes (pass-through args, e.g. -- --only paper)
    cmds:
      - go run ./e2e/sandbox {{.CLI_ARGS}}

  sandboxes:clean:
    desc: Remove generated sandboxes (.sandboxes)
    cmds:
      - rm -rf .sandboxes

  logos:gen:
    desc: "Generate the status logos from terminal/assets/logos.yaml (args: -- -only papermc -preview test_logos)"
    cmds:
      - go run ./tools/genlogo {{.CLI_ARGS}}

  logos:check:
    desc: Fail when the committed status logos differ from what terminal/assets/logos.yaml generates
    cmds:
      - go run ./tools/genlogo -check
  docs:pack:
    desc: "Pack the site pages into docs/docs.tar.gz"
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - go run ./tools/gendocs {{.CLI_ARGS}}

  docs:wiki:
    desc: "Render the GitHub wiki mirror into dist/wiki"
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - go run ./tools/genwiki -out dist/wiki

  e2e:init:
    desc: "Initialize modpack manifests from sandboxes (args: -run 'TestInitialize/<modpack id>')"
    deps:
      - build
    cmds:
      - go test -tags e2e -count=1 -timeout 0 ./e2e/init {{.CLI_ARGS}}

  e2e:compile:
    desc: "Compile pinned repository fixtures (args: -run 'TestCompile/<fixture id>')"
    deps:
      - build
    cmds:
      - go test -tags e2e -count=1 -timeout 0 -parallel 1 ./e2e/compile {{.CLI_ARGS}}

  e2e:compile:smoke:
    desc: "Compile the fixtures marked smoke (args: -run 'TestCompile/<fixture id>')"
    deps:
      - build
    cmds:
      - LUCY_COMPILE_LAYER=smoke go test -tags e2e -count=1 -timeout 0 -parallel 1 ./e2e/compile {{.CLI_ARGS}}

  e2e:mutation:
    desc: "Run the full heuristic mutation suite with the built CLI (args: -run '<case id>')"
    deps:
      - build
    cmds:
      - LUCY_HEURISTIC_LAYER=full go test -tags e2e -count=1 -timeout 0 -parallel 3 -v ./e2e/mutation {{.CLI_ARGS}}

  e2e:mutation:smoke:
    desc: "Run the smoke layer of the heuristic mutation suite (args: -run '<case id>')"
    deps:
      - build
    cmds:
      - LUCY_HEURISTIC_LAYER=smoke go test -tags e2e -count=1 -timeout 0 -parallel 3 -v ./e2e/mutation {{.CLI_ARGS}}

  ci:test:
    desc: Run the CI verification suite (for GitHub Actions); conditionally generates cipher material
    cmds:
      - |
        if [ -n "${CURSEFORGE_API_KEY:-}" ]; then
          task cipher:generate
        fi
      - task: check
      - task: test:coverage

  ci:build:
    desc: Build release artifacts for CI (for GitHub Actions); conditionally generates cipher material
    cmds:
      - |
        if [ -n "${CURSEFORGE_API_KEY:-}" ]; then
          task cipher:generate
        fi
      - task: build:release
      - gzip -f release/lucy-linux-amd64
      - gzip -f release/lucy-linux-arm64
      - gzip -f release/lucy-windows-amd64.exe
      - gzip -f release/lucy-darwin-amd64
      - gzip -f release/lucy-darwin-arm64

  release:check:
    desc: Validate .goreleaser.yaml without building or publishing
    cmds:
      - go tool goreleaser check

  release:snapshot:
    desc: Build a local GoReleaser snapshot without publishing (unbound cipher identity)
    cmds:
      - bash scripts/release-snapshot.sh
