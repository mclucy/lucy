# https://taskfile.dev

version: "3"
interval: 700ms

dotenv:
  - ".env"
  - ".cipher_key"
  - ".cipher_ciphertext"

vars:
  DEV_GOOS:
    sh: go env GOOS
  DEV_GOARCH:
    sh: go env GOARCH
  DEV_BINARY: dist/lucy-{{.DEV_GOOS}}-{{.DEV_GOARCH}}
  DEV_SYMLINK: dist/lucy
  LUCY_VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LUCY_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  # SECURITY: cipher fragments must NOT live in this var — Task expands vars into command logs.
  LUCY_LDFLAGS: -X github.com/mclucy/lucy/cmd.version={{.LUCY_VERSION}} -X github.com/mclucy/lucy/cmd.commit={{.LUCY_COMMIT}}

tasks:
  build:
    desc: Build the local development binary for the host platform
    deps:
      - check:cf-api-key
    cmds:
      - |
        set -euo pipefail
        mkdir -p dist
        ldflags="{{.LUCY_LDFLAGS}}"
        if [ -f .cipher_key ]; then
          KEY_A=$(sed -n 's/^cipher_key_a=//p' .cipher_key)
          KEY_B=$(sed -n 's/^cipher_key_b=//p' .cipher_key)
          CT_A=$(sed -n 's/^cipher_ciphertext_a=//p' .cipher_key)
          CT_B=$(sed -n 's/^cipher_ciphertext_b=//p' .cipher_key)
          if [ -z "$CT_A" ] && [ -f .cipher_ciphertext ]; then
            CT_A=$(sed -n 's/^cipher_ciphertext_a=//p' .cipher_ciphertext)
            CT_B=$(sed -n 's/^cipher_ciphertext_b=//p' .cipher_ciphertext)
          fi
          if [ -n "$KEY_A" ] && [ -n "$KEY_B" ] && [ -n "$CT_A" ] && [ -n "$CT_B" ]; then
            ldflags="$ldflags \
              -X github.com/mclucy/lucy/internal/cipher.keyA=$KEY_A \
              -X github.com/mclucy/lucy/internal/cipher.keyB=$KEY_B \
              -X github.com/mclucy/lucy/internal/cipher.ciphertextA=$CT_A \
              -X github.com/mclucy/lucy/internal/cipher.ciphertextB=$CT_B"
          fi
        fi
        GOOS={{.DEV_GOOS}} GOARCH={{.DEV_GOARCH}} go build -ldflags="$ldflags" -tags debug -o {{.DEV_BINARY}}
        ln -sf lucy-{{.DEV_GOOS}}-{{.DEV_GOARCH}} {{.DEV_SYMLINK}}
    sources:
      - "./**/*.go"
      - "./go.mod"
      - "./go.sum"
    generates:
      - "{{.DEV_BINARY}}"
      - "{{.DEV_SYMLINK}}"

  build:dev:
    desc: Alias for build
    deps:
      - build

  dev:
    desc: Alias for build
    deps:
      - build

  build:watch:
    desc: Rebuild the local debug binary on Go file changes
    cmds:
      - task build
    watch: true
    sources:
      - "./**/*.go"
      - "./go.mod"
      - "./go.sum"
    method: timestamp

  build:release:
    desc: Build release binaries for Windows, Linux, and macOS
    deps:
      - clean:release
      - check:cf-api-key
    cmds:
      - |
        set -euo pipefail
        mkdir -p release
        ldflags="-w -s {{.LUCY_LDFLAGS}}"
        if [ -f .cipher_key ]; then
          KEY_A=$(sed -n 's/^cipher_key_a=//p' .cipher_key)
          KEY_B=$(sed -n 's/^cipher_key_b=//p' .cipher_key)
          CT_A=$(sed -n 's/^cipher_ciphertext_a=//p' .cipher_key)
          CT_B=$(sed -n 's/^cipher_ciphertext_b=//p' .cipher_key)
          if [ -z "$CT_A" ] && [ -f .cipher_ciphertext ]; then
            CT_A=$(sed -n 's/^cipher_ciphertext_a=//p' .cipher_ciphertext)
            CT_B=$(sed -n 's/^cipher_ciphertext_b=//p' .cipher_ciphertext)
          fi
          if [ -n "$KEY_A" ] && [ -n "$KEY_B" ] && [ -n "$CT_A" ] && [ -n "$CT_B" ]; then
            ldflags="$ldflags \
              -X github.com/mclucy/lucy/internal/cipher.keyA=$KEY_A \
              -X github.com/mclucy/lucy/internal/cipher.keyB=$KEY_B \
              -X github.com/mclucy/lucy/internal/cipher.ciphertextA=$CT_A \
              -X github.com/mclucy/lucy/internal/cipher.ciphertextB=$CT_B"
            if [ -n "${CIPHER_RELEASE_VERSION:-}" ] && [ -n "${CIPHER_RELEASE_COMMIT:-}" ]; then
              ldflags="$ldflags \
                -X github.com/mclucy/lucy/internal/cipher.releaseVersion=${CIPHER_RELEASE_VERSION} \
                -X github.com/mclucy/lucy/internal/cipher.releaseCommit=${CIPHER_RELEASE_COMMIT}"
            fi
          fi
        fi
        GOOS=linux GOARCH=amd64 go build -ldflags="$ldflags" -tags release -o release/lucy-linux-amd64
        GOOS=linux GOARCH=arm64 go build -ldflags="$ldflags" -tags release -o release/lucy-linux-arm64
        GOOS=windows GOARCH=amd64 go build -ldflags="$ldflags" -tags release -o release/lucy-windows-amd64.exe
        GOOS=darwin GOARCH=amd64 go build -ldflags="$ldflags" -tags release -o release/lucy-darwin-amd64
        GOOS=darwin GOARCH=arm64 go build -ldflags="$ldflags" -tags release -o release/lucy-darwin-arm64
    sources:
      - "./**/*.go"
      - "./go.mod"
      - "./go.sum"

  clean:
    desc: Remove all generated build artifacts
    deps:
      - clean:dist
      - clean:release

  clean:dist:
    desc: Remove development build artifacts
    cmds:
      - rm -rf dist {{.DEV_SYMLINK}}

  clean:release:
    desc: Remove release build artifacts
    cmds:
      - rm -rf release

  run:
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    desc: Run the local latest codebase with the provided arguments
    cmds:
      - go run {{.TASKFILE_DIR}} {{.CLI_ARGS}}

  cipher:generate:
    silent: true
    desc: Generate unbound local cipher material from CF_API_KEY
    cmds:
      - |
        set -euo pipefail
        if [ -z "${CF_API_KEY:-}" ]; then
          printf "[ERROR] CF_API_KEY is not set\n" >&2
          exit 1
        fi
        # Optional identity for tagged releases (set by CI). Empty = unbound local.
        if [ -n "${CIPHER_RELEASE_VERSION:-}" ] && [ -n "${CIPHER_RELEASE_COMMIT:-}" ]; then
          :
        elif [ -n "${CIPHER_RELEASE_VERSION:-}" ] || [ -n "${CIPHER_RELEASE_COMMIT:-}" ]; then
          printf "[ERROR] both CIPHER_RELEASE_VERSION and CIPHER_RELEASE_COMMIT must be set together\n" >&2
          exit 1
        fi
        BOUND=false
        if [ -n "${CIPHER_RELEASE_VERSION:-}" ]; then
          BOUND=true
        fi
        # Secret via stdin only — never on the process argv. Capture four
        # fragment lines without logging fragment values or the secret.
        GEN_ARGS=(-encrypt-stdin)
        if [ -n "${CIPHER_RELEASE_VERSION:-}" ] && [ -n "${CIPHER_RELEASE_COMMIT:-}" ]; then
          GEN_ARGS+=(-version "${CIPHER_RELEASE_VERSION}" -commit "${CIPHER_RELEASE_COMMIT}")
        fi
        # Pipe from env var into stdin; silent:true keeps this body out of Task logs.
        OUT=$(printf '%s' "${CF_API_KEY}" | go run ./cmd/cipher "${GEN_ARGS[@]}")
        KEY_A=$(printf '%s\n' "$OUT" | sed -n 's/^cipher_key_a=//p')
        KEY_B=$(printf '%s\n' "$OUT" | sed -n 's/^cipher_key_b=//p')
        CT_A=$(printf '%s\n' "$OUT" | sed -n 's/^cipher_ciphertext_a=//p')
        CT_B=$(printf '%s\n' "$OUT" | sed -n 's/^cipher_ciphertext_b=//p')
        if [ -z "$KEY_A" ] || [ -z "$KEY_B" ] || [ -z "$CT_A" ] || [ -z "$CT_B" ]; then
          printf "[ERROR] cipher generator produced incomplete fragments\n" >&2
          exit 1
        fi
        {
          printf 'cipher_bound=%s\n' "$BOUND"
          printf 'cipher_key_a=%s\n' "$KEY_A"
          printf 'cipher_key_b=%s\n' "$KEY_B"
          printf 'cipher_ciphertext_a=%s\n' "$CT_A"
          printf 'cipher_ciphertext_b=%s\n' "$CT_B"
        } > .cipher_key
        # Keep companion file for dotenv compatibility; ciphertext halves live with key file.
        {
          printf 'cipher_ciphertext_a=%s\n' "$CT_A"
          printf 'cipher_ciphertext_b=%s\n' "$CT_B"
        } > .cipher_ciphertext
        printf "[OK] Wrote .cipher_key and .cipher_ciphertext (four fragments)\n"
    generates:
      - .cipher_key
      - .cipher_ciphertext

  check:cf-api-key:
    silent: true
    desc: Verify CF_API_KEY against the CurseForge API
    cmds:
      - |
        if [ -z "${CF_API_KEY:-}" ]; then
          printf "[WARN] CF_API_KEY is not set — CurseForge API calls will fail\n"
          exit 0
        fi
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Accept: application/json" \
          -H "x-api-key: $CF_API_KEY" \
          "https://api.curseforge.com/v1/games?pageSize=1" 2>/dev/null || echo "000")
        case "$STATUS" in
          200) printf "[OK] CF_API_KEY verified against CurseForge API\n" ;;
          401) printf "[WARN] CF_API_KEY rejected by CurseForge API (HTTP 401)\n" ;;
          000) printf "[WARN] Could not reach CurseForge API (network error)\n" ;;
          *)   printf "[WARN] CurseForge API returned unexpected status %s\n" "$STATUS" ;;
        esac

  test:
    desc: Run the Go test suite
    cmds:
      - go test ./...

  test:race:
    desc: Run the Go test suite with the race detector
    cmds:
      - go test -race ./...

  test:coverage:
    desc: Run the Go test suite with a coverage profile
    cmds:
      - go test -coverprofile=cover.out ./...
      - go tool gocover-cobertura < cover.out > coverage.xml
  check:
    desc: Run the default local verification tasks
    deps:
      - build
      - test
      - test:race

  envs:list:
    desc: List sandbox environments defined in the manifest
    cmds:
      - go run ./tools/envgen --list

  envs:gen:
    desc: Materialize sandbox environments into .sandboxes (pass-through args, e.g. -- --only paper)
    cmds:
      - go run ./tools/envgen {{.CLI_ARGS}}

  envs:clean:
    desc: Remove generated sandbox environments (.sandboxes)
    cmds:
      - rm -rf .sandboxes

  envs:probe-e2e:
    desc: "Run e2e for server probing over generated sandboxes (args: environment ids)"
    cmds:
      - ./scripts/server-probe-e2e.sh {{.CLI_ARGS}}

  ci:test:
    desc: Run the CI test suite (for GitHub Actions); conditionally generates cipher files then runs checks
    cmds:
      - |
        if [ -n "${CF_API_KEY:-}" ]; then
          task cipher:generate
        fi
      - task: build
      - task: test:race
      - task: test:coverage

  ci:build:
    desc: Build release artifacts for CI (for GitHub Actions); conditionally generates cipher files
    cmds:
      - |
        if [ -n "${CF_API_KEY:-}" ]; then
          task cipher:generate
        fi
      - task: build:release
      - gzip -f release/lucy-linux-amd64
      - gzip -f release/lucy-linux-arm64
      - gzip -f release/lucy-windows-amd64.exe
      - gzip -f release/lucy-darwin-amd64
      - gzip -f release/lucy-darwin-arm64

  release:check:
    desc: Validate .goreleaser.yaml without building or publishing
    cmds:
      - go tool goreleaser check

  release:snapshot:
    desc: Build a local GoReleaser snapshot without publishing (unbound cipher identity)
    cmds:
      - |
        set -euo pipefail
        # Prefer four-fragment cipher files, then CIPHER_* env, then dotenv-loaded vars.
        # Never put these in Task vars — Task expands vars into command logs.
        # Snapshot identity is empty in .goreleaser.yaml so material must be unbound.
        if [ -f .cipher_key ]; then
          if grep -qx 'cipher_bound=true' .cipher_key; then
            printf "[ERROR] bound cipher material cannot be used for a snapshot; run task cipher:generate without CIPHER_RELEASE_*\n" >&2
            exit 1
          fi
          export CIPHER_KEY_A CIPHER_KEY_B CIPHER_CIPHERTEXT_A CIPHER_CIPHERTEXT_B
          CIPHER_KEY_A=$(sed -n 's/^cipher_key_a=//p' .cipher_key)
          CIPHER_KEY_B=$(sed -n 's/^cipher_key_b=//p' .cipher_key)
          CIPHER_CIPHERTEXT_A=$(sed -n 's/^cipher_ciphertext_a=//p' .cipher_key)
          CIPHER_CIPHERTEXT_B=$(sed -n 's/^cipher_ciphertext_b=//p' .cipher_key)
          if [ -z "$CIPHER_CIPHERTEXT_A" ] && [ -f .cipher_ciphertext ]; then
            CIPHER_CIPHERTEXT_A=$(sed -n 's/^cipher_ciphertext_a=//p' .cipher_ciphertext)
            CIPHER_CIPHERTEXT_B=$(sed -n 's/^cipher_ciphertext_b=//p' .cipher_ciphertext)
          fi
        elif [ -n "${CIPHER_KEY_A:-}" ] && [ -n "${CIPHER_KEY_B:-}" ] \
          && [ -n "${CIPHER_CIPHERTEXT_A:-}" ] && [ -n "${CIPHER_CIPHERTEXT_B:-}" ]; then
          :
        elif [ -n "${cipher_key_a:-}" ] && [ -n "${cipher_key_b:-}" ] \
          && [ -n "${cipher_ciphertext_a:-}" ] && [ -n "${cipher_ciphertext_b:-}" ]; then
          export CIPHER_KEY_A="${cipher_key_a}"
          export CIPHER_KEY_B="${cipher_key_b}"
          export CIPHER_CIPHERTEXT_A="${cipher_ciphertext_a}"
          export CIPHER_CIPHERTEXT_B="${cipher_ciphertext_b}"
        fi
        go tool goreleaser release --snapshot --clean --skip=publish
