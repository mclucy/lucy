# https://taskfile.dev

version: "3"
interval: 700ms

dotenv:
  - ".env"
  - ".cipher_key"
  - ".cipher_ciphertext"

vars:
  DEV_GOOS:
    sh: go env GOOS
  DEV_GOARCH:
    sh: go env GOARCH
  DEV_BINARY: dist/lucy-{{.DEV_GOOS}}-{{.DEV_GOARCH}}-dev
  LUCY_LDFLAGS:
    sh: |
      if [ -f .cipher_key ] && [ -f .cipher_ciphertext ]; then
        KEY=$(cut -d= -f2 .cipher_key)
        TEXT=$(cut -d= -f2 .cipher_ciphertext)
        printf '%s' "-X github.com/mclucy/lucy/internal/cipher.Key=$KEY -X github.com/mclucy/lucy/internal/cipher.Ciphertext=$TEXT"
      fi

tasks:
  copyright-add:
    desc: Add missing copyright headers to Go files
    cmds:
      - ./copyright.sh add

  copyright-remove:
    desc: Remove copyright headers from Go files
    cmds:
      - ./copyright.sh remove

  clean:
    desc: Remove all generated build artifacts
    deps:
      - clean:dist
      - clean:release

  clean:dist:
    desc: Remove development build artifacts
    cmds:
      - rm -rf dist

  clean:release:
    desc: Remove release build artifacts
    cmds:
      - rm -rf release

  run:
    silent: true
    dir: "{{.USER_WORKING_DIR}}"
    desc: Run the local latest codebase with the provided arguments
    cmds:
      - go run {{.TASKFILE_DIR}} {{.CLI_ARGS}}

  cipher-generate:
    desc: Generate new cipher key and ciphertext from CF_API_KEY
    cmds:
      - |
        set -e
        CF_API_KEY="${CF_API_KEY}"  # Ensure variable is set
        KEY=$(go run ./tools/cipher -keygen | cut -d= -f2)
        CIPHERTEXT=$(go run -ldflags "-X github.com/mclucy/lucy/internal/cipher.Key=$KEY" ./tools/cipher -encrypt "$CF_API_KEY" | cut -d= -f2)
        echo "cipher_key=$KEY" > .cipher_key
        echo "cipher_ciphertext=$CIPHERTEXT" > .cipher_ciphertext
        cat .cipher_key
        cat .cipher_ciphertext
    generates:
      - .cipher_key
      - .cipher_ciphertext

  check:cf-api-key:
    silent: true
    desc: Verify CF_API_KEY against the CurseForge API
    cmds:
      - |
        if [ -z "${CF_API_KEY:-}" ]; then
          printf "[WARN] CF_API_KEY is not set — CurseForge API calls will fail\n"
          exit 0
        fi
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          -H "Accept: application/json" \
          -H "x-api-key: $CF_API_KEY" \
          "https://api.curseforge.com/v1/games?pageSize=1" 2>/dev/null || echo "000")
        case "$STATUS" in
          200) printf "[OK] CF_API_KEY verified against CurseForge API\n" ;;
          401) printf "[WARN] CF_API_KEY rejected by CurseForge API (HTTP 401)\n" ;;
          000) printf "[WARN] Could not reach CurseForge API (network error)\n" ;;
          *)   printf "[WARN] CurseForge API returned unexpected status %s\n" "$STATUS" ;;
        esac

  build:release:
    desc: Build release binaries for Windows, Linux, and macOS
    deps:
      - clean:release
      - check:cf-api-key
    cmds:
      - mkdir -p release
      - GOOS=linux GOARCH=amd64 go build -ldflags="-w -s {{.LUCY_LDFLAGS}}" -tags release -o release/lucy-linux-amd64
      - GOOS=windows GOARCH=amd64 go build -ldflags="-w -s {{.LUCY_LDFLAGS}}" -tags release -o release/lucy-windows-amd64.exe
      - GOOS=darwin GOARCH=amd64 go build -ldflags="-w -s {{.LUCY_LDFLAGS}}" -tags release -o release/lucy-darwin-amd64
      - GOOS=darwin GOARCH=arm64 go build -ldflags="-w -s {{.LUCY_LDFLAGS}}" -tags release -o release/lucy-darwin-arm64
    sources:
      - "./**/*.go"
      - "./go.mod"
      - "./go.sum"

  build:dev-core:
    desc: Build the local development binary for the host platform
    deps:
      - check:cf-api-key
    cmds:
      - mkdir -p dist
      - GOOS={{.DEV_GOOS}} GOARCH={{.DEV_GOARCH}} go build -ldflags="{{.LUCY_LDFLAGS}}" -tags debug -o {{.DEV_BINARY}}
    sources:
      - "./**/*.go"
      - "./go.mod"
      - "./go.sum"
    generates:
      - "{{.DEV_BINARY}}"

  build:dev:
    desc: Clean and build the local host development binary
    deps:
      - clean:dist
      - build:dev-core

  build:watch:
    desc: Rebuild the local debug binary on Go file changes
    cmds:
      - task build:dev-core
    watch: true
    sources:
      - "./**/*.go"
      - "./go.mod"
      - "./go.sum"
    method: timestamp

  build:
    desc: Build the local development binary
    deps:
      - build:dev

  dev:
    desc: Build the default local development binary
    deps:
      - build:dev

  test:
    desc: Run the Go test suite
    cmds:
      - go test ./...

  test:race:
    desc: Run the Go test suite with the race detector
    cmds:
      - go test -race ./...

  check:
    desc: Run the default local verification tasks
    deps:
      - build:dev-core
      - test
      - test:race

  build-release:
    internal: true
    deps:
      - build:release

  build-dev:
    internal: true
    deps:
      - build:dev

  build-dev-incremental:
    internal: true
    deps:
      - build:dev-core

  build-watch:
    internal: true
    deps:
      - build:watch

  cleanup-dist:
    internal: true
    deps:
      - clean:dist

  cleanup-release:
    internal: true
    deps:
      - clean:release
